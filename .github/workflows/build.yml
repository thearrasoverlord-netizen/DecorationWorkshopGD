name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          bindings-ref: 7f6c2a0c8f0c5c7f4e8c2c6a0f5f4c0d2a5b8e4f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecorationWorkshopGD
          path: output/*.geode
